<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>入眠之境</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  min-height:100vh; min-height:-webkit-fill-available;
  background: radial-gradient(ellipse at 30% 20%, #0d1b3e 0%, #060d1f 45%, #020510 100%);
  font-family: Georgia, 'PingFang SC', 'STSong', serif;
  color: #c8d8f0;
  display:flex; flex-direction:column; align-items:center;
  padding: 1.8rem 1rem 3rem;
  overflow-x:hidden;
}
canvas#stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.wrap { position:relative; z-index:1; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; gap:1.3rem; }
.header { text-align:center; }
.header .sub { font-size:.68rem; letter-spacing:.35em; color:#4a6a9a; text-transform:uppercase; margin-bottom:.4rem; }
.header h1 { font-size:1.9rem; font-weight:300; color:#e8f0ff; letter-spacing:.06em; }
.header .tag { font-size:.6rem; color:#2a4a7a; letter-spacing:.22em; margin-top:.25rem; }
#orb-wrap { position:relative; width:190px; height:190px; display:flex; align-items:center; justify-content:center; }
.ring { position:absolute; border-radius:50%; border:1px solid rgba(60,120,200,.1); transition:transform 5s ease-in-out; }
#orb {
  width:140px; height:140px; border-radius:50%;
  background: radial-gradient(circle at 35% 35%, #2a5acc, #0a1a4a 70%);
  box-shadow: 0 0 40px rgba(40,80,200,.4), 0 0 80px rgba(20,50,150,.2), inset 0 0 30px rgba(0,0,0,.5);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:transform 5s ease-in-out;
  animation:float 4s ease-in-out infinite;
  cursor:pointer; user-select:none;
}
#orb.active { animation:none; }
#orb-label { font-size:.78rem; color:#90b8f8; letter-spacing:.12em; margin-bottom:.1rem; }
#orb-count { font-size:2.2rem; color:#c8d8ff; font-weight:300; line-height:1; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
#subtitle {
  min-height:3rem; text-align:center; font-size:.88rem;
  color:#8ab0d8; font-style:italic; line-height:1.7;
  padding:0 .5rem; transition:opacity .4s;
}
#subtitle.fade { opacity:0; }
#phase-box { text-align:center; width:100%; }
#phase-name { font-size:.62rem; letter-spacing:.3em; color:#3a6aaa; margin-bottom:.35rem; }
#phase-bar-bg { width:100%; height:2px; background:#0d1a35; border-radius:2px; }
#phase-bar { height:100%; border-radius:2px; background:linear-gradient(90deg,#1a4a9a,#5080d0); width:0%; transition:width 1s linear; }
#timer { font-size:1rem; color:#2a4a8a; letter-spacing:.22em; font-variant-numeric:tabular-nums; }
#btn-main {
  padding:.9rem 2.8rem;
  background: linear-gradient(135deg, #1a3a7a, #2a60c0);
  border:1px solid #4a80d0; border-radius:50px;
  color:#c0d8f8; font-size:1rem; cursor:pointer;
  letter-spacing:.1em; transition:all .3s;
  font-family:Georgia,'PingFang SC',serif; -webkit-appearance:none;
}
#btn-main.stop { background:rgba(25,40,80,.7); border-color:#2a4070; }
.nature-row { display:flex; gap:.55rem; }
.nat-btn {
  padding:.4rem .95rem; border-radius:50px; font-size:.78rem;
  background:rgba(12,22,50,.6); border:1px solid #152238;
  color:#2a4a7a; cursor:pointer; transition:all .3s;
  font-family:Georgia,'PingFang SC',serif; -webkit-appearance:none;
}
.nat-btn.on { background:rgba(30,65,140,.5); border-color:#3a6ab0; color:#80aae0; }
.sliders { width:100%; display:flex; flex-direction:column; gap:.65rem; }
.slider-row { display:flex; align-items:center; gap:.7rem; }
.slider-row label { font-size:.75rem; color:#3a5a8a; width:5.6rem; flex-shrink:0; }
input[type=range] { flex:1; accent-color:#3a70c0; opacity:.8; cursor:pointer; height:20px; }
#voice-box {
  width:100%; border:1px solid #0f1e3a; border-radius:14px;
  background:rgba(6,12,32,.75); padding:.9rem 1.1rem; text-align:center;
}
#voice-status { font-size:.72rem; color:#3a5a8a; letter-spacing:.1em; margin-bottom:.4rem; }
#voice-heard { font-size:.85rem; color:#5a80b0; min-height:1.2rem; font-style:italic; }
#mic-btn {
  margin-top:.65rem; padding:.42rem 1.3rem; border-radius:50px;
  background:rgba(15,30,80,.6); border:1px solid #1e3868;
  color:#5070a0; font-size:.78rem; cursor:pointer; transition:all .3s;
  font-family:Georgia,'PingFang SC',serif; -webkit-appearance:none;
}
#mic-btn.on { background:rgba(35,15,70,.7); border-color:#5a2a9a; color:#a060e0; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
.cmd-grid { display:grid; grid-template-columns:1fr 1fr; gap:.35rem .7rem; margin-top:.7rem; }
.cmd-item { font-size:.62rem; color:#243a60; }
.cmd-item span { color:#4a7090; }
.cards { display:flex; gap:.55rem; flex-wrap:wrap; justify-content:center; }
.card { flex:1 1 88px; min-width:88px; background:rgba(8,16,42,.65); border:1px solid #0f1e3a; border-radius:12px; padding:.75rem .85rem; }
.card .ci { font-size:1.1rem; margin-bottom:.2rem; }
.card .ct { font-size:.62rem; color:#5a88c0; font-weight:600; letter-spacing:.04em; margin-bottom:.18rem; }
.card .cd { font-size:.58rem; color:#2a4870; line-height:1.55; }
#tts-toggle {
  font-size:.68rem; color:#2a4060; cursor:pointer; padding:.25rem .7rem;
  border:1px solid #152030; border-radius:20px; background:rgba(8,15,35,.5);
  font-family:Georgia,'PingFang SC',serif; -webkit-appearance:none;
}
#tts-toggle.muted { color:#6a3030; border-color:#3a1020; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="header">
    <div class="sub">深度睡眠引导</div>
    <h1>入眠之境</h1>
    <div class="tag">THETA · 冥想语音 · 自然音 · 语音控制</div>
  </div>
  <div id="orb-wrap">
    <div class="ring" style="width:158px;height:158px"></div>
    <div class="ring" style="width:175px;height:175px;opacity:.65"></div>
    <div class="ring" style="width:192px;height:192px;opacity:.35"></div>
    <div id="orb" onclick="togglePlay()">
      <span id="orb-label">🌙</span>
      <span id="orb-count"></span>
    </div>
  </div>
  <div id="subtitle">轻触上方月亮，开始入眠引导</div>
  <div id="phase-box" style="display:none">
    <div id="phase-name"></div>
    <div style="height:.4rem"></div>
    <div id="phase-bar-bg"><div id="phase-bar"></div></div>
  </div>
  <div id="timer" style="display:none">00:00</div>
  <button id="btn-main" onclick="togglePlay()">▶ 开始入眠</button>
  <button id="tts-toggle" onclick="toggleTTS()">🔊 语音旁白：开</button>
  <div class="nature-row">
    <button class="nat-btn on" id="nat-rain"   onclick="setNature('rain')">🌧 雨声</button>
    <button class="nat-btn"    id="nat-ocean"  onclick="setNature('ocean')">🌊 海浪</button>
    <button class="nat-btn"    id="nat-forest" onclick="setNature('forest')">🌲 森林</button>
  </div>
  <div class="sliders">
    <div class="slider-row"><label>🌿 自然音量</label><input id="sl-nature"   type="range" min="0" max="1" step=".01" value=".7"  oninput="setVol('nature',this.value)"></div>
    <div class="slider-row"><label>🧠 Theta脑波</label><input id="sl-binaural" type="range" min="0" max="1" step=".01" value=".5"  oninput="setVol('binaural',this.value)"></div>
    <div class="slider-row"><label>🎵 冥想音调</label><input id="sl-drone"    type="range" min="0" max="1" step=".01" value=".5"  oninput="setVol('drone',this.value)"></div>
  </div>
  <div id="voice-box">
    <div id="voice-status">🎤 语音控制</div>
    <div id="voice-heard">点击下方按钮后对着手机说指令</div>
    <button id="mic-btn" onclick="toggleMic()">🎤 开始监听</button>
    <div class="cmd-grid">
      <div class="cmd-item">说 <span>"开始"</span> → 播放</div>
      <div class="cmd-item">说 <span>"停止"</span> → 停止</div>
      <div class="cmd-item">说 <span>"换雨声"</span> → 雨声</div>
      <div class="cmd-item">说 <span>"换海浪"</span> → 海浪</div>
      <div class="cmd-item">说 <span>"换森林"</span> → 森林</div>
      <div class="cmd-item">说 <span>"大声点"</span> → 音量+</div>
      <div class="cmd-item">说 <span>"小声点"</span> → 音量-</div>
      <div class="cmd-item">说 <span>"晚安"</span> → 结束</div>
    </div>
  </div>
  <div class="cards">
    <div class="card"><div class="ci">🌊</div><div class="ct">Theta 脑波</div><div class="cd">4 Hz 双耳节拍，建议戴耳机</div></div>
    <div class="card"><div class="ci">🎙</div><div class="ct">语音旁白</div><div class="cd">冥想引导全程朗读，呼吸报数</div></div>
    <div class="card"><div class="ci">🌙</div><div class="ct">4-7-8 呼吸</div><div class="cd">激活副交感神经快速平静</div></div>
  </div>
</div>
<script>
// ── STARS ─────────────────────────────────────
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let ST=[];
function initS(){cv.width=innerWidth;cv.height=innerHeight;ST=Array.from({length:110},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:.3+Math.random()*1.4,ph:Math.random()*6.28,sp:.25+Math.random()*.7}));}
function drawS(ts){cx.clearRect(0,0,cv.width,cv.height);ST.forEach(s=>{const a=.15+.75*(.5+.5*Math.sin(ts*.001*s.sp+s.ph));cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fillStyle=`rgba(155,190,255,${a})`;cx.fill();});requestAnimationFrame(drawS);}
initS();addEventListener('resize',initS);requestAnimationFrame(drawS);

// ── TTS ENGINE ────────────────────────────────
let ttsMuted=false,ttsQ=[],ttsBusy=false;
function toggleTTS(){ttsMuted=!ttsMuted;const b=document.getElementById('tts-toggle');b.textContent=ttsMuted?'🔇 语音旁白：关':'🔊 语音旁白：开';b.classList.toggle('muted',ttsMuted);if(ttsMuted){speechSynthesis.cancel();ttsQ=[];ttsBusy=false;}}
function speak(text,force=false,rate=0.76,pitch=0.9){
  if(!('speechSynthesis'in window))return;
  showSub(text);
  if(ttsMuted)return;
  if(force){speechSynthesis.cancel();ttsQ=[];ttsBusy=false;}
  ttsQ.push({text,rate,pitch});
  if(!ttsBusy)nextTTS();
}
function nextTTS(){
  if(!ttsQ.length){ttsBusy=false;return;}
  ttsBusy=true;
  const{text,rate,pitch}=ttsQ.shift();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=rate;u.pitch=pitch;u.volume=0.88;
  const vs=speechSynthesis.getVoices();
  const zh=vs.find(v=>v.lang.startsWith('zh')&&/female|tingting|meijia|sinji|xiaoyu/i.test(v.name));
  if(zh)u.voice=zh;
  u.onend=()=>setTimeout(nextTTS,280);
  u.onerror=()=>setTimeout(nextTTS,280);
  speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
function showSub(text){const el=document.getElementById('subtitle');el.classList.add('fade');setTimeout(()=>{el.textContent=text;el.classList.remove('fade');},380);}

// ── AUDIO ─────────────────────────────────────
let AC=null,MG=null,RG,OG,FG,BG,DG;
let nat='rain',vN=.7,vB=.5,vD=.5;
function initAudio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  MG=AC.createGain();MG.gain.value=0;MG.connect(AC.destination);
  RG=mkRain();OG=mkOcean();FG=mkForest();BG=mkBinaural();DG=mkDrone();
  [RG,OG,FG,BG,DG].forEach(g=>g.connect(MG));
  applyVols();
}
function mkNoise(t){const sr=AC.sampleRate,len=sr*4,buf=AC.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=buf.getChannelData(c);let lv=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(t==='brown'){d[i]=(lv+.02*w)/1.02;lv=d[i];d[i]*=3.5;}else d[i]=w*.5;}}const s=AC.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;}
function mkRain(){const n=mkNoise('brown'),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=1100;g.gain.value=0;n.connect(f);f.connect(g);(function sw(){g.gain.setTargetAtTime(vN*.35*(.75+Math.random()*.55),AC.currentTime,2+Math.random()*3);setTimeout(sw,(4+Math.random()*7)*1000);})();return g;}
function mkOcean(){const n=mkNoise('brown'),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=380;f.Q.value=.5;g.gain.value=0;const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.11;lg.gain.value=240;lfo.connect(lg);lg.connect(f.frequency);lfo.start();const vl=AC.createOscillator(),vg2=AC.createGain();vl.frequency.value=.1;vg2.gain.value=vN*.3*.4;vl.connect(vg2);vg2.connect(g.gain);vl.start();n.connect(f);f.connect(g);return g;}
function mkForest(){const n=mkNoise('brown'),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=650;g.gain.value=0;n.connect(f);f.connect(g);(function ch(){const o=AC.createOscillator(),cg=AC.createGain();o.frequency.value=2200+Math.random()*2800;o.type='sine';cg.gain.value=0;o.connect(cg);cg.connect(AC.destination);o.start();const now=AC.currentTime;cg.gain.setTargetAtTime(.028,now,.04);cg.gain.setTargetAtTime(0,now+.18,.09);setTimeout(()=>{try{o.stop();o.disconnect();}catch(e){}},1100);setTimeout(ch,(1.2+Math.random()*4.8)*1000);})();return g;}
function mkBinaural(){const m=AC.createChannelMerger(2),g=AC.createGain();g.gain.value=vB*.18;[432,436].forEach((f,i)=>{const o=AC.createOscillator(),og=AC.createGain();o.frequency.value=f;o.type='sine';og.gain.value=.5;o.connect(og);og.connect(m,0,i);o.start();});m.connect(g);return g;}
function mkDrone(){const g=AC.createGain();g.gain.value=vD*.12;[110,165,220,330].forEach(f=>{const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=f;og.gain.value=.25;const vl=AC.createOscillator(),vg2=AC.createGain();vl.frequency.value=.28+Math.random()*.35;vg2.gain.value=1.1;vl.connect(vg2);vg2.connect(o.frequency);vl.start();o.connect(og);og.connect(g);o.start();});return g;}
function applyVols(){if(!AC)return;const t=AC.currentTime;RG.gain.setTargetAtTime(nat==='rain'?vN*.35:0,t,.9);OG.gain.setTargetAtTime(nat==='ocean'?vN*.3:0,t,.9);FG.gain.setTargetAtTime(nat==='forest'?vN*.25:0,t,.9);BG.gain.setTargetAtTime(vB*.18,t,.9);DG.gain.setTargetAtTime(vD*.12,t,.9);}

// ── PHASES & SCRIPTS ─────────────────────────
const PHASES=[
  {dur:70,name:'第一阶段 · 放松身体',breath:'478',script:[
    {t:1,  s:'现在，轻轻闭上你的眼睛。'},
    {t:6,  s:'感受身体的重量，慢慢沉入床铺之中。'},
    {t:14, s:'从脚趾开始，一点一点地放松……'},
    {t:22, s:'放松你的小腿……膝盖……大腿……'},
    {t:32, s:'放松腹部……背部……胸口……'},
    {t:42, s:'放松双肩……双臂……双手……'},
    {t:53, s:'放松你的颈部……下巴……眼皮……'},
    {t:64, s:'全身越来越沉……越来越放松……'},
  ]},
  {dur:90,name:'第二阶段 · 平静心念',breath:'478',script:[
    {t:2,  s:'想象你站在一片宁静的夜晚旷野中。'},
    {t:10, s:'头顶是深蓝色的星空，繁星点点。'},
    {t:19, s:'微风轻抚，带走所有的疲惫。'},
    {t:29, s:'每一个念头，都像夜空中划过的流星。'},
    {t:40, s:'轻轻看着它……然后，让它消散。'},
    {t:52, s:'不必抓住，不必追逐。'},
    {t:63, s:'只是静静地……观察呼吸。'},
    {t:76, s:'心越来越平静……越来越平静……'},
  ]},
  {dur:110,name:'第三阶段 · 深度放松',breath:'slow',script:[
    {t:2,  s:'感受全身，越来越沉重。'},
    {t:10, s:'就像慢慢沉入一片温暖的、柔软的云朵。'},
    {t:22, s:'云朵轻柔地托住你，让你感到无比安全。'},
    {t:35, s:'每一次呼气，你都沉得更深一些……'},
    {t:48, s:'更深……更深……'},
    {t:60, s:'你的思维开始变得模糊……'},
    {t:72, s:'像水中的倒影，渐渐散开……'},
    {t:85, s:'只剩下这一片宁静……和你的呼吸……'},
    {t:100,s:'呼吸……呼吸……'},
  ]},
  {dur:9999,name:'第四阶段 · 进入睡眠',breath:'slow',script:[
    {t:2,  s:'让自己漂浮……'},
    {t:14, s:'漂浮在黑暗与宁静之间……'},
    {t:30, s:'不需要做任何事……'},
    {t:48, s:'只是呼吸……'},
    {t:68, s:'慢慢地……慢慢地……'},
    {t:92, s:'沉入睡眠……'},
    {t:125,s:'好梦……'},
  ]}
];

// ── PLAYBACK ──────────────────────────────────
let playing=false,pIdx=0,pTime=0,total=0;
let tickIv=null,breathTm=null,breathCntIv=null,scriptTms=[];

function togglePlay(){playing?stopSession():startSession();}

function startSession(){
  initAudio();
  if(AC.state==='suspended')AC.resume();
  MG.gain.cancelScheduledValues(AC.currentTime);
  MG.gain.setTargetAtTime(1,AC.currentTime,3.5);
  playing=true;pIdx=0;pTime=0;total=0;
  document.getElementById('btn-main').textContent='⏹ 停止';
  document.getElementById('btn-main').classList.add('stop');
  document.getElementById('phase-box').style.display='block';
  document.getElementById('timer').style.display='block';
  const orb=document.getElementById('orb');
  orb.classList.add('active');orb.style.animation='none';
  updatePhaseUI();startBreath(PHASES[0].breath);schedScript(0);
  speak('开始入眠引导。请放松，跟随呼吸球的节奏，慢慢呼吸。',true,0.73,0.9);
  tickIv=setInterval(()=>{
    total++;pTime++;updateTimerUI();updateBar();
    if(pIdx<PHASES.length-1&&pTime>=PHASES[pIdx].dur){
      pIdx++;pTime=0;updatePhaseUI();
      clearBreath();startBreath(PHASES[pIdx].breath);schedScript(pIdx);
      speak(PHASES[pIdx].name,true,0.68,0.88);
    }
  },1000);
}

function stopSession(){
  clearInterval(tickIv);clearBreath();
  scriptTms.forEach(clearTimeout);scriptTms=[];
  MG.gain.setTargetAtTime(0,AC.currentTime,2.5);
  playing=false;
  document.getElementById('btn-main').textContent='▶ 开始入眠';
  document.getElementById('btn-main').classList.remove('stop');
  document.getElementById('phase-box').style.display='none';
  document.getElementById('timer').style.display='none';
  const o=document.getElementById('orb');
  o.classList.remove('active');o.style.animation='float 4s ease-in-out infinite';
  o.style.transform='scale(1)';
  document.querySelectorAll('.ring').forEach(r=>r.style.transform='');
  document.getElementById('orb-label').textContent='🌙';
  document.getElementById('orb-count').textContent='';
  speechSynthesis.cancel();ttsQ=[];ttsBusy=false;
  setTimeout(()=>speak('已停止。晚安，好梦。',false,0.7,.9),500);
}

function schedScript(idx){
  scriptTms.forEach(clearTimeout);scriptTms=[];
  PHASES[idx].script.forEach(({t,s})=>{
    scriptTms.push(setTimeout(()=>speak(s,false,0.71,0.9),t*1000));
  });
}

function updateTimerUI(){const m=String(Math.floor(total/60)).padStart(2,'0'),s=String(total%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s;}
function updateBar(){const p=PHASES[pIdx];if(p.dur===9999){document.getElementById('phase-bar').style.width='100%';return;}document.getElementById('phase-bar').style.width=(pTime/p.dur*100)+'%';}
function updatePhaseUI(){document.getElementById('phase-name').textContent=PHASES[pIdx].name;document.getElementById('phase-bar').style.width='0%';}

// ── BREATHING ─────────────────────────────────
const BPHRASES={'吸气':['吸气','慢慢吸气','深深吸气'],'屏住':['屏住','轻轻屏住'],'呼气':['呼气','慢慢呼气','轻轻呼出']};
function clearBreath(){clearTimeout(breathTm);clearInterval(breathCntIv);}

function startBreath(type){
  clearBreath();
  const orb=document.getElementById('orb'),rings=document.querySelectorAll('.ring');
  function animOrb(sc,dur){orb.style.transition=`transform ${dur} ease-in-out`;orb.style.transform=`scale(${sc})`;rings.forEach((r,i)=>{r.style.transition=`transform ${dur} ease-in-out`;r.style.transform=`scale(${sc*(1+i*.055)})`; });}
  function setCount(phase,count,sc,durStr,durMs,next){
    document.getElementById('orb-label').textContent=phase;
    document.getElementById('orb-count').textContent=count;
    animOrb(sc,durStr);
    const opts=BPHRASES[phase]||[phase];
    speak(opts[Math.floor(Math.random()*opts.length)],false,1.0,0.85);
    clearInterval(breathCntIv);
    let c=count;
    if(count>2){breathCntIv=setInterval(()=>{c--;if(c<=0){clearInterval(breathCntIv);return;}document.getElementById('orb-count').textContent=c;if(c<=3)speak(String(c),false,1.1,.8);},1000);}
    breathTm=setTimeout(next,durMs);
  }
  if(type==='478'){
    function cy478(){setCount('吸气',4,1.28,'4s',4000,()=>{setCount('屏住',7,1.32,'.5s',7000,()=>{setCount('呼气',8,.72,'8s',8000,cy478);});});}
    cy478();
  } else {
    function cySlow(){setCount('吸气',5,1.22,'5s',5000,()=>{setCount('呼气',6,.72,'6s',6000,cySlow);});}
    cySlow();
  }
}

// ── NATURE & VOL ──────────────────────────────
function setNature(n){nat=n;document.querySelectorAll('.nat-btn').forEach(b=>b.classList.remove('on'));document.getElementById('nat-'+n).classList.add('on');applyVols();}
function setVol(t,v){if(t==='nature')vN=+v;if(t==='binaural')vB=+v;if(t==='drone')vD=+v;applyVols();}

// ── VOICE RECOGNITION ─────────────────────────
let recog=null,micOn=false;
function toggleMic(){micOn?stopMic():startMic();}
function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('voice-heard').textContent='请用Safari（iOS）或Chrome使用语音控制';return;}
  recog=new SR();recog.lang='zh-CN';recog.continuous=true;recog.interimResults=true;
  recog.onstart=()=>{micOn=true;document.getElementById('mic-btn').textContent='🔴 聆听中…';document.getElementById('mic-btn').classList.add('on');document.getElementById('voice-status').textContent='🎤 正在监听';};
  recog.onend=()=>{if(micOn)recog.start();};
  recog.onerror=(e)=>{document.getElementById('voice-heard').textContent='错误：'+e.error;};
  recog.onresult=(e)=>{let fin='',tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const tx=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=tx;else tmp+=tx;}document.getElementById('voice-heard').textContent='"'+(fin||tmp)+'"';if(fin)handleCmd(fin.trim());};
  recog.start();
}
function stopMic(){micOn=false;if(recog){recog.stop();recog=null;}document.getElementById('mic-btn').textContent='🎤 开始监听';document.getElementById('mic-btn').classList.remove('on');document.getElementById('voice-status').textContent='🎤 语音控制';document.getElementById('voice-heard').textContent='已停止监听';}
function handleCmd(txt){
  const t=txt.toLowerCase();
  if(t.includes('开始')||t.includes('播放')){if(!playing)startSession();}
  else if(t.includes('停止')||t.includes('暂停')){if(playing)stopSession();}
  else if(t.includes('雨')){setNature('rain');speak('切换到雨声',true);}
  else if(t.includes('海')){setNature('ocean');speak('切换到海浪声',true);}
  else if(t.includes('森林')||t.includes('树')){setNature('forest');speak('切换到森林声',true);}
  else if(t.includes('大声')||t.includes('音量大')){vN=Math.min(1,vN+.2);applyVols();document.getElementById('sl-nature').value=vN;speak('音量增大',true);}
  else if(t.includes('小声')||t.includes('音量小')||t.includes('轻')){vN=Math.max(0,vN-.2);applyVols();document.getElementById('sl-nature').value=vN;speak('音量减小',true);}
  else if(t.includes('晚安')||t.includes('关闭')){speak('晚安，好梦',true,.7,.88);setTimeout(()=>{if(playing)stopSession();},2500);}
}
</script>
